<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | Kamyl</title>
  <!-- Articles now live at research/<slug>/ and writing/<slug>/ (built by tools/build.mjs).
       This page only forwards old article.html?slug= links there. -->
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");</script>
  <link rel="stylesheet" href="article.css?v=1" />
</head>
<body>

<nav>
  <a href="index.html#activities" class="nav-back">← Writing</a>
  <a href="index.html" class="nav-name">Kamyl</a>
  <span></span>
</nav>

<div class="article-wrap">
  <div id="articleLoading" class="article-loading">Loading article...</div>
  <div id="articleError" class="article-error" style="display:none;">
    Article not found. <a href="index.html">Return to home</a>
  </div>
</div>

<script src="data.js?v=10"></script>
<script>
  const slug = new URLSearchParams(location.search).get('slug');
  const pub = PORTFOLIO_DATA.publications.find(p => p.slug && p.slug === slug);
  const piece = PORTFOLIO_DATA.activities.find(a => a.slug === slug);
  if (pub) location.replace(`research/${slug}/`);
  else if (piece) location.replace(`writing/${slug}/`);
  else {
    document.getElementById('articleLoading').style.display = 'none';
    document.getElementById('articleError').style.display = 'block';
  }
</script>
</body>
</html>
