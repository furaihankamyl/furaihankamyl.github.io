<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | Kamyl</title>

  <meta name="description" content="Writing on public policy, research, and government relations by Furaihan Kamyl Arnazaye." />
  <meta property="og:title" content="Furaihan Kamyl Arnazaye" />
  <meta property="og:description" content="Writing on public policy, research, and government relations." />
  <meta property="og:image" content="https://furaihankamyl.github.io/images/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Furaihan Kamyl Arnazaye" />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://furaihankamyl.github.io/images/og-cover.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");</script>

  <style>
    :root {
      --bg: #fafafa; --bg-2: #f1f1f1; --surface: #ffffff;
      --border: #e4e4e4; --text: #111111; --text-2: #545454; --text-3: #8a8a8a;
      --accent: #111111;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --radius: 4px; --radius-lg: 8px;
    }
    [data-theme="dark"] {
      --bg: #0d0d0d; --bg-2: #151515; --surface: #1a1a1a;
      --border: #2a2a2a; --text: #f2f2f2; --text-2: #a6a6a6; --text-3: #6e6e6e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body); font-size: 15px; line-height: 1.7;
      font-weight: 300; transition: background 0.3s, color 0.3s;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0 48px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.3s;
    }
    .nav-back {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-2); transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-name {
      font-family: var(--font-display); font-size: 17px;
      font-weight: 500; color: var(--text);
    }
    .theme-toggle {
      background: none; border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-2); font-size: 14px; transition: all 0.2s;
    }
    .theme-toggle:hover { border-color: var(--text-2); color: var(--text); }

    /* ARTICLE LAYOUT */
    .article-wrap {
      max-width: 720px; margin: 0 auto;
      padding: 96px 48px 80px;
    }

    /* META */
    .article-meta {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
    }
    .article-category {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 16px;
    }
    .article-headline {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 52px); font-weight: 300;
      line-height: 1.1; color: var(--text);
      margin-bottom: 16px;
    }
    .article-info {
      display: flex; gap: 20px; align-items: center;
      font-size: 12px; color: var(--text-3);
    }
    .reading-time { letter-spacing: 0.04em; }

    /* MARKDOWN CONTENT */
    .article-content h1 {
      font-family: var(--font-display); font-size: 36px; font-weight: 300;
      color: var(--text); margin: 48px 0 20px; line-height: 1.2;
    }
    .article-content h2 {
      font-family: var(--font-display); font-size: 26px; font-weight: 400;
      color: var(--text); margin: 36px 0 12px; line-height: 1.3;
    }
    .article-content h3 {
      font-size: 15px; font-weight: 500; color: var(--text);
      margin: 28px 0 12px; letter-spacing: 0.02em;
    }
    .article-content p {
      font-size: 15px; color: var(--text-2); line-height: 1.75;
      margin-bottom: 16px; font-weight: 300;
    }
    .article-content strong { color: var(--text); font-weight: 500; }
    .article-content em { font-style: italic; color: var(--text-2); }
    .article-content ul, .article-content ol {
      list-style: none; padding-left: 0; margin-bottom: 16px;
    }
    .article-content ul li, .article-content ol li {
      font-size: 15px; color: var(--text-2); line-height: 1.7;
      margin-bottom: 8px; padding-left: 20px; position: relative;
    }
    .article-content ul li::before {
      content: ''; position: absolute; left: 0; top: 11px;
      width: 6px; height: 1px; background: var(--text-3);
    }
    .article-content ol { counter-reset: item; }
    .article-content ol li { counter-increment: item; }
    .article-content ol li::before {
      content: counter(item) '.'; position: absolute; left: 0;
      font-size: 12px; color: var(--text-3);
    }
    .article-content img {
      width: 100%; border-radius: var(--radius-lg);
      margin: 32px 0; border: 1px solid var(--border);
    }
    .article-content hr {
      border: none; border-top: 1px solid var(--border); margin: 40px 0;
    }
    .article-content blockquote {
      border-left: 2px solid var(--border);
      padding: 12px 20px; margin: 24px 0;
      color: var(--text-2); font-style: italic;
    }
    .article-content code {
      background: var(--bg-2); padding: 2px 6px;
      border-radius: var(--radius); font-size: 13px;
    }
    .article-content pre {
      background: var(--bg-2); padding: 20px; border-radius: var(--radius-lg);
      overflow-x: auto; margin: 24px 0;
    }
    .article-content a {
      border-bottom: 1px solid var(--border); transition: border-color 0.2s;
    }
    .article-content a:hover { border-color: var(--text); }

    /* TABLES */
    .article-content .table-wrap { overflow-x: auto; margin: 32px 0; }
    .article-content table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .article-content th, .article-content td {
      text-align: left; padding: 10px 12px 10px 0;
      border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top;
    }
    .article-content th {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-3); font-weight: 400;
    }
    .article-content td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .article-content td.ok { color: var(--text); }
    .article-content tr.group td {
      color: var(--text); font-weight: 500; padding-top: 18px; border-bottom: none;
    }

    /* CHARTS (HTML bars, themed through the page tokens) */
    .chart { margin: 40px 0; }
    .chart-title { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 4px; }
    .chart-sub { font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
    .chart figcaption { font-size: 11px; color: var(--text-3); margin-top: 14px; line-height: 1.6; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--text-2); margin-bottom: 20px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .swatch-a, .hbar.a .hbar-fill, .col-bar { background: var(--text-3); }
    .swatch-b, .hbar.b .hbar-fill { background: var(--text); }
    .col-last .col-bar { background: var(--text); }

    .cols {
      display: flex; align-items: flex-end; gap: 12px; height: 200px;
      border-bottom: 1px solid var(--border); padding-top: 20px;
    }
    .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .col-val { font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .col-bar { width: 100%; max-width: 24px; height: var(--v); border-radius: 4px 4px 0 0; }
    .col-labels { display: flex; gap: 12px; margin-top: 8px; }
    .col-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--text-3); }

    .pair { padding: 14px 0; border-top: 1px solid var(--border); }
    .pair:first-of-type { border-top: none; }
    .pair-label { font-size: 13px; color: var(--text); margin-bottom: 2px; }
    .pair-note { font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
    .hbar { display: flex; align-items: center; gap: 8px; height: 18px; margin-bottom: 4px; }
    .hbar-track { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .hbar-fill { height: 12px; width: var(--v); min-width: 2px; border-radius: 0 4px 4px 0; }
    .hbar-val { font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .hbar-name { width: 64px; flex-shrink: 0; font-size: 11px; color: var(--text-3); }
    .hbar.wide .hbar-name { width: 104px; }

    .schematic { display: flex; flex-wrap: wrap; gap: 16px; }
    /* KEY TAKEAWAYS (top of explainers) */
    .takeaways {
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--bg-2); padding: 20px 22px 8px; margin: 0 0 36px;
    }
    .takeaways-title {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 12px;
    }
    .article-content .takeaways ul li { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 10px; }

    /* KEY FINDING CALLOUT (one per article, in place of a bold sentence) */
    .callout {
      margin: 28px 0; padding: 2px 0 2px 20px; border-left: 2px solid var(--text);
      font-family: var(--font-display); font-size: 23px; font-weight: 400; line-height: 1.4; color: var(--text);
    }
    .callout span {
      display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
    }

    /* STAT TILES */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 28px 0; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .stat { background: var(--bg); padding: 14px 16px; }
    @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat-value { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.1; }
    .stat-label { font-size: 11px; color: var(--text-3); margin-top: 6px; line-height: 1.45; }

    /* PIPELINE */
    .pipeline { display: flex; flex-wrap: wrap; gap: 6px; counter-reset: step; }
    .pipeline > div {
      flex: 1 1 120px; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--text-2); counter-increment: step;
    }
    .pipeline > div::before { content: counter(step); display: block; font-size: 10px; color: var(--text-3); margin-bottom: 4px; }
    .pipeline strong { display: block; color: var(--text); font-weight: 500; font-size: 13px; }

    /* SEGMENTED TOGGLE + TABS */
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; margin-bottom: 16px; }
    .seg button, .tab-btns button {
      font: inherit; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      background: none; border: none; color: var(--text-3); cursor: pointer;
      padding: 6px 12px; border-radius: 999px; transition: background 0.2s, color 0.2s;
    }
    .seg button[aria-pressed="true"], .tab-btns button[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .seg button:focus-visible, .tab-btns button:focus-visible, [data-tip]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .tab-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
    .tab-panel[hidden] { display: none; }
    .tab-panel p { font-size: 13px; margin-bottom: 12px; }
    .mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .mini-stats div { border-top: 1px solid var(--border); padding-top: 8px; font-size: 11px; color: var(--text-3); }
    .mini-stats b { display: block; font-size: 18px; font-weight: 600; color: var(--text); }
    @media (max-width: 480px) { .mini-stats { grid-template-columns: repeat(2, 1fr); } }
    .chart-note { font-size: 12px; color: var(--text-3); line-height: 1.6; }

    /* Views switched by .seg: bars animate between --v and --v2 */
    .chart .hbar-fill { transition: width 0.45s ease; }
    .chart[data-view="alt"] .hbar-fill { width: var(--v2, var(--v)); }
    .chart .val-alt, .chart[data-view="alt"] .val-main { display: none; }
    .chart[data-view="alt"] .val-alt { display: inline; }

    /* TOOLTIP */
    [data-tip] { cursor: help; }
    .pair[data-tip]:hover .pair-label, .col[data-tip]:hover .col-val { color: var(--text); }
    .tip {
      position: fixed; z-index: 200; max-width: 260px; pointer-events: none;
      background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.5;
      padding: 8px 10px; border-radius: var(--radius); opacity: 0; transition: opacity 0.12s;
      white-space: pre-line;
    }
    .tip.show { opacity: 1; }
    .tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--border); border-radius: 999px; padding: 1px 6px; color: var(--text-2); margin-left: 6px; white-space: nowrap; }

    /* STACKED BARS (levels: high / medium / low) */
    .stack-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .stack-name { width: 96px; flex-shrink: 0; font-size: 11px; color: var(--text-3); }
    .stack { flex: 1; display: flex; gap: 2px; height: 14px; min-width: 0; }
    .stack i { display: block; height: 100%; }
    .stack i:last-child { border-radius: 0 4px 4px 0; }
    .stack .s-hi, .swatch-hi { background: var(--text); }
    .stack .s-mid, .swatch-mid { background: var(--text-3); }
    .stack .s-lo, .swatch-lo { background: var(--border); box-shadow: inset 0 0 0 1px var(--text-3); }
    .stack-val { width: 44px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .stack-group { font-size: 12px; color: var(--text); margin: 14px 0 8px; }

    /* STRIP PLOT (dots on one scale, dashed-free reference line) */
    .strip-row { display: flex; align-items: center; gap: 10px; margin: 22px 0 6px; }
    .strip-name { width: 110px; flex-shrink: 0; font-size: 11px; color: var(--text-2); line-height: 1.35; }
    .strip { position: relative; flex: 1; height: 34px; border-bottom: 1px solid var(--border); }
    .strip .dot {
      position: absolute; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
      background: var(--text-3); box-shadow: 0 0 0 2px var(--bg); transition: opacity 0.25s, background 0.25s;
    }
    .strip .dot.key { background: var(--text); }
    .strip .ref { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--text); }
    .strip .ref span { position: absolute; top: -14px; left: 4px; font-size: 10px; color: var(--text-2); white-space: nowrap; }
    .strip-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); margin-left: 120px; }
    .chart[data-view="c1"] .dot:not(.c1), .chart[data-view="c2"] .dot:not(.c2), .chart[data-view="c3"] .dot:not(.c3) { opacity: 0.12; }
    .chart[data-view="c1"] .dot.c1, .chart[data-view="c2"] .dot.c2, .chart[data-view="c3"] .dot.c3 { background: var(--text); }

    /* UNIT CHART (one square per informant) */
    .unit-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); }
    .unit-name { flex: 1; font-size: 12px; color: var(--text-2); line-height: 1.4; min-width: 0; }
    .units { display: flex; gap: 3px; flex-shrink: 0; }
    .units i { width: 14px; height: 14px; border-radius: 3px; display: block; }
    .u-yes, .swatch-yes { background: var(--text); }
    .u-maybe, .swatch-maybe { background: var(--text-3); }
    .u-no, .swatch-no { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
    .u-na, .swatch-na { background: var(--border); }
    .chart-legend i.swatch-no { box-shadow: inset 0 0 0 1.5px var(--text-3); }

    .schematic > div { flex: 1 1 260px; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .schematic svg { width: 100%; height: auto; display: block; }
    .schematic-title { font-size: 12px; color: var(--text); margin-bottom: 4px; }
    .schematic-note { font-size: 11px; color: var(--text-3); margin-top: 8px; line-height: 1.5; }
    .schematic line { stroke: var(--text-3); stroke-width: 1; }
    .schematic line.strong { stroke: var(--text); stroke-width: 2.5; }
    .schematic circle { fill: var(--text-3); stroke: var(--bg); stroke-width: 2; }
    .schematic circle.hub { fill: var(--text); }
    .schematic text {
      fill: var(--text-2); font-family: var(--font-body); font-size: 13px;
      paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
    }

    /* READING PROGRESS */
    .read-progress {
      position: fixed; top: 56px; left: 0; right: 0; height: 2px; z-index: 101;
      background: var(--text); transform-origin: left; transform: scaleX(0);
      pointer-events: none;
    }

    /* NEXT ARTICLE */
    .article-next {
      display: block; margin-top: 64px;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 28px; background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .article-next:hover {
      border-color: var(--text-3); transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .article-next-label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .article-next-title {
      font-family: var(--font-display); font-size: 24px; font-weight: 400;
      line-height: 1.25; color: var(--text);
    }
    .article-next-cat { font-size: 11px; color: var(--text-3); margin-top: 8px; }

    /* PAPER CTA (publication explainers) */
    .paper-cta {
      margin-top: 56px; padding: 28px;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--bg-2);
    }
    .paper-cta-label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 10px;
    }
    .paper-cta-title {
      font-family: var(--font-display); font-size: 22px; font-weight: 400;
      line-height: 1.3; color: var(--text); margin-bottom: 6px;
    }
    .paper-cta-venue { font-size: 12px; font-style: italic; color: var(--text-2); margin-bottom: 20px; }

    /* ERROR / LOADING */
    .article-error, .article-loading {
      text-align: center; padding: 80px 0;
      color: var(--text-3); font-size: 13px;
    }
    .article-error a {
      color: var(--text-2); border-bottom: 1px solid var(--border);
    }

    /* BACK BOTTOM */
    .article-back-bottom {
      margin-top: 64px; padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-2); border: 1px solid var(--border);
      padding: 10px 20px; border-radius: var(--radius);
      transition: all 0.2s;
    }
    .back-link:hover { border-color: var(--text); color: var(--text); }

    @media (max-width: 768px) {
      nav { padding: 0 24px; }
      .article-wrap { padding: 80px 24px 60px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html#activities" class="nav-back" id="navBack">← Activities</a>
  <a href="index.html" class="nav-name">Kamyl</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☀</button>
</nav>
<div class="read-progress" id="readProgress"></div>

<div class="article-wrap">
  <div id="articleMeta" class="article-meta" style="display:none;">
    <div class="article-category" id="articleCategory"></div>
    <h1 class="article-headline" id="articleHeadline"></h1>
    <div class="article-info">
      <span id="articleDate"></span>
      <span>·</span>
      <span class="reading-time" id="readingTime"></span>
    </div>
  </div>

  <div id="articleLoading" class="article-loading">Loading article...</div>
  <div id="articleError" class="article-error" style="display:none;">
    Article not found. <a href="index.html" id="errorBack">Return to home</a>
  </div>
  <div id="articleContent" class="article-content" style="display:none;"></div>

  <div id="paperCta" class="paper-cta" style="display:none;">
    <div class="paper-cta-label">The full paper</div>
    <div class="paper-cta-title" id="paperCtaTitle"></div>
    <div class="paper-cta-venue" id="paperCtaVenue"></div>
    <a id="paperCtaLink" class="back-link" target="_blank" rel="noopener">Read the paper ↗</a>
  </div>

  <a id="articleNext" class="article-next" style="display:none;">
    <div class="article-next-label"><span>Next article</span><span>↗</span></div>
    <div class="article-next-title" id="articleNextTitle"></div>
    <div class="article-next-cat" id="articleNextCat"></div>
  </a>

  <div class="article-back-bottom">
    <a href="index.html#activities" class="back-link" id="bottomBack">← Back to Activities</a>
  </div>
</div>

<script src="data.js"></script>
<script>
  // Theme
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const toggle = document.getElementById('themeToggle');
  toggle.textContent = saved === 'dark' ? '☀' : '☾';
  toggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    toggle.textContent = next === 'dark' ? '☀' : '☾';
  });

  // Get slug from URL
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  function calcReadingTime(text) {
    const wpm = 200;
    // Count prose only: chart markup embedded in the Markdown is not read
    const words = text.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length;
    const mins = Math.ceil(words / wpm);
    return `${mins} min read`;
  }

  async function loadArticle() {
    if (!slug) {
      showError(); return;
    }

    // An article is either an Activity or a Publication explainer
    const activity = PORTFOLIO_DATA.activities.find(a => a.slug === slug);
    const pub = !activity && PORTFOLIO_DATA.publications.find(p => p.slug === slug);
    if (!activity && !pub) { showError(); return; }
    const entry = activity || {
      slug: pub.slug,
      title: pub.explainerTitle || pub.title,
      category: 'Research Explainer',
      date: pub.year
    };
    if (pub) setupPublication(pub);

    // Set OG/page title
    document.title = `${entry.title} | Kamyl`;

    // Populate meta
    document.getElementById('articleCategory').textContent = entry.category;
    document.getElementById('articleHeadline').textContent = entry.title;
    document.getElementById('articleDate').textContent = entry.date;

    try {
      const res = await fetch(`content/${slug}.md`);
      if (!res.ok) throw new Error('Not found');
      const md = await res.text();

      // Configure marked
      marked.setOptions({
        breaks: true,
        gfm: true
      });

      const html = marked.parse(md);

      document.getElementById('readingTime').textContent = calcReadingTime(md);
      document.getElementById('articleMeta').style.display = 'block';
      document.getElementById('articleContent').innerHTML = html;
      initWidgets(document.getElementById('articleContent'));
      document.getElementById('articleContent').style.display = 'block';
      document.getElementById('articleLoading').style.display = 'none';
      if (pub) document.getElementById('paperCta').style.display = 'block';
      renderNextArticle(entry, pub ? explainers() : PORTFOLIO_DATA.activities);
    } catch (e) {
      showError();
    }
  }

  // Interactive pieces embedded in article Markdown (scripts inside
  // Markdown do not run, so behavior is wired here by data attributes)
  function initWidgets(root) {
    // Segmented toggle: sets data-view on the closest .chart
    root.querySelectorAll('.seg').forEach(seg => {
      const chart = seg.closest('.chart');
      seg.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
          chart.dataset.view = btn.dataset.view;
        });
      });
    });

    // Tabs
    root.querySelectorAll('[data-tabs]').forEach(box => {
      const btns = box.querySelectorAll('.tab-btns button');
      btns.forEach(btn => btn.addEventListener('click', () => {
        btns.forEach(b => b.setAttribute('aria-selected', String(b === btn)));
        box.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.dataset.panel !== btn.dataset.tab; });
      }));
    });

    // Tooltips: hover on desktop, tap on touch, focus for keyboard
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.setAttribute('role', 'tooltip');
    document.body.appendChild(tip);
    let current = null;
    function show(el) {
      current = el;
      tip.textContent = el.dataset.tip;
      tip.classList.add('show');
      const r = el.getBoundingClientRect();
      const t = tip.getBoundingClientRect();
      const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
      const top = r.top - t.height - 8 < 64 ? r.bottom + 8 : r.top - t.height - 8;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    }
    function hide() { current = null; tip.classList.remove('show'); }
    root.querySelectorAll('[data-tip]').forEach(el => {
      if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
      el.addEventListener('mouseenter', () => show(el));
      el.addEventListener('mouseleave', hide);
      el.addEventListener('focus', () => show(el));
      el.addEventListener('blur', hide);
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (e.pointerType === 'mouse') return; // hover already handles mouse
        current === el ? hide() : show(el);
      });
    });
    document.addEventListener('click', hide);
    window.addEventListener('scroll', hide, { passive: true });
  }

  // Publication explainers, in the same shape as Activities
  function explainers() {
    return PORTFOLIO_DATA.publications.filter(p => p.slug).map(p => ({
      slug: p.slug,
      title: p.explainerTitle || p.title,
      category: 'Research Explainer',
      date: p.year
    }));
  }

  // Point navigation back to Publications and link the full paper
  function setupPublication(pub) {
    ['navBack', 'bottomBack'].forEach(id => {
      const el = document.getElementById(id);
      el.href = 'index.html#publications';
      el.textContent = id === 'navBack' ? '← Publications' : '← Back to Publications';
    });
    document.getElementById('paperCtaTitle').textContent = pub.title;
    document.getElementById('paperCtaVenue').textContent = `${pub.venue}, ${pub.year}`;
    document.getElementById('paperCtaLink').href = `https://drive.google.com/file/d/${pub.driveId}/view`;
  }

  // Next article: the entry after the current one in its list, wrapping around
  function renderNextArticle(current, all) {
    if (all.length < 2) return;
    const idx = all.findIndex(a => a.slug === current.slug);
    const next = all[(idx + 1) % all.length];
    const card = document.getElementById('articleNext');
    card.href = `article.html?slug=${next.slug}`;
    document.getElementById('articleNextTitle').textContent = next.title;
    document.getElementById('articleNextCat').textContent = `${next.category} · ${next.date}`;
    card.style.display = 'block';
  }

  // Reading progress hairline under the nav
  (function initReadProgress() {
    const bar = document.getElementById('readProgress');
    let raf = null;
    function update() {
      raf = null;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      bar.style.transform = `scaleX(${p})`;
    }
    window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', () => { if (!raf) raf = requestAnimationFrame(update); });
    update();
  })();

  function showError() {
    document.getElementById('articleLoading').style.display = 'none';
    document.getElementById('articleError').style.display = 'block';
  }

  loadArticle();
</script>
</body>
</html>
