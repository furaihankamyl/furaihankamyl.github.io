<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#272c36; --txt:#e6e8ec; --muted:#8b929e; --accent:#3b82f6; --green:#22c55e; --red:#ef4444; }
    * { box-sizing: border-box; }
    body { width: 360px; margin:0; padding:12px; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; font-size:12.5px; background:var(--bg); color:var(--txt); }
    h1 { font-size:13px; margin:0 0 10px; font-weight:600; }
    label { display:block; font-size:11px; color:var(--muted); margin:8px 0 3px; }
    textarea, input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:7px; font-family:inherit; font-size:12px; }
    textarea { height:96px; resize:vertical; }
    .row { display:flex; gap:6px; align-items:center; }
    .row input { width:80px; }
    .btns { display:flex; gap:6px; margin:10px 0; }
    button { flex:1; padding:8px; border:none; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; color:#fff; }
    #start { background:var(--green); }
    #stop  { background:var(--red); }
    #download { background:var(--accent); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .bar { height:7px; background:var(--panel); border-radius:99px; overflow:hidden; margin:6px 0 4px; border:1px solid var(--line); }
    .bar > div { height:100%; width:0%; background:var(--accent); transition:width .3s; }
    .counter { font-size:11px; color:var(--muted); margin-bottom:8px; }
    .counter b { color:var(--txt); }
    #log { background:#0b0d11; border:1px solid var(--line); border-radius:6px; height:140px; overflow-y:auto; padding:6px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:10.5px; line-height:1.5; }
    #log div { white-space:pre-wrap; word-break:break-word; }
    #log .t { color:var(--muted); }
  </style>
</head>
<body>
  <h1>IG Following Scraper — SNA Media Mapping</h1>

  <label>Daftar username (satu per baris, komentar pakai #)</label>
  <textarea id="accounts" placeholder="dpr_ri&#10;kemnaker  # Komisi IX&#10;# baris ini diabaikan"></textarea>

  <div class="row">
    <div style="flex:1">
      <label>Jeda antar akun (detik, min 30)</label>
      <input id="delay" type="number" min="30" value="60" />
    </div>
  </div>

  <div class="btns">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="download">Download</button>
  </div>

  <div class="bar"><div id="barFill"></div></div>
  <div class="counter" id="counter">Idle.</div>

  <div id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
